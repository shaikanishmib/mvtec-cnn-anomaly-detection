[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "mvtec-cnn-anomaly-detection"
version = "0.1.0"
description = "Reproducible MVTec AD anomaly detection research"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy==2.5.4", "pandas==2.3.3", "pillow==13.0.0",
  "matplotlib==3.11.2", "scipy==1.18.1", "scikit-learn==1.9.1",
  "torch==2.15.0", "torchvision==0.29.2",
  "nbformat==5.11.1", "nbclient==0.11.0", "ipykernel==7.4.0",
  "pytest==9.2.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
